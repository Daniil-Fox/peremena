<div class="modal">
  <section class="cta">
    <div class="container">
      <div class="cta__container">
        <button class="btn-reset modal__close modal__close--md">
          <svg
            width="30"
            height="30"
            viewBox="0 0 30 30"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M1 1L29 29M29 1L1 29"
              stroke="black"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <div class="cta__content">
          <div class="cta__header corner-smooth-40">
            <h2 class="title2 cta__title">напишите нам</h2>

            <button class="btn-reset modal__close">
              <svg
                width="30"
                height="30"
                viewBox="0 0 30 30"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M1 1L29 29M29 1L1 29"
                  stroke="black"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <div class="cta__img cta__img--mob">
            <img src="./img/hero-bg.webp" alt="" />
          </div>
          <form
            action="#"
            class="modal__form form corner-smooth-40"
            novalidate="novalidate"
          >
            <div class="form__field form__field--long">
              <div class="form__field-wrapper">
                <input
                  id="name123"
                  type="text"
                  class="form__input input-name"
                  name="Имя"
                />
                <label for="name123" class="form__label">как ваше имя?</label>
              </div>
            </div>
            <div class="form__field form__field--long">
              <label for="contact-method-modal" class="visually-hidden"
                >где с вами связаться?</label
              >
              <select
                id="contact-method-modal"
                name="Способ связи"
                class="visually-hidden select-contact"
                aria-label="где с вами связаться?"
              >
                <option value="">где с вами связаться?</option>
                <option value="Telegram">Telegram</option>
                <option value="Whatsapp">Whatsapp</option>
                <option value="Email">Email</option>
              </select>

              <div class="dropdown form__dropdown">
                <div class="dropdown__header">
                  <div class="dropdown__label">где с вами связаться?</div>
                  <div class="dropdown__capture">где с вами связаться?</div>
                  <div class="dropdown__btn">
                    <svg class="">
                      <use
                        xlink:href="https://peremena.store/wp-content/themes/peremena/assets/img/sprite.svg#arr-down"
                      ></use>
                    </svg>
                  </div>
                </div>
                <div class="dropdown__body">
                  <div class="dropdown__content">
                    <div class="dropdown__item"></div>
                    <div class="dropdown__item">Telegram</div>
                    <div class="dropdown__item">Whatsapp</div>
                    <div class="dropdown__item">Email</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="form__field" style="display: none">
              <div class="form__field-wrapper">
                <input
                  id="tel123"
                  type="text"
                  class="form__input input-tel"
                  name="Телефон"
                  style="display: block"
                  disabled=""
                />
                <input
                  type="email"
                  class="form__input input-email"
                  name="Почта"
                  style="display: none"
                  disabled=""
                />
                <label for="tel123" class="form__label">телефон/email</label>
              </div>
            </div>
            <div class="form__field form__field--long">
              <div class="form__field-wrapper form__field-wrapper--area">
                <textarea
                  id="msg123"
                  class="form__input form__input--area input-mess"
                  name="Сообщение"
                ></textarea>
                <label for="msg123" class="form__label"
                  >введите текст сообщения</label
                >
                <div class="textarea-scrollbar disabled">
                  <button
                    class="textarea-scroll-btn textarea-scroll-up disabled"
                    type="button"
                    disabled=""
                  >
                    <svg
                      width="8"
                      height="6"
                      viewBox="0 0 8 6"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M2.84767 1.3828C3.19874 0.961515 3.37427 0.750872 3.57584 0.656461C3.8446 0.53058 4.15539 0.53058 4.42415 0.656461C4.62572 0.750871 4.80126 0.961513 5.15233 1.3828L6.94977 3.53973C7.52958 4.23549 7.81948 4.58338 7.85673 4.872C7.9064 5.25682 7.72897 5.63564 7.40154 5.84385C7.15597 6 6.70313 6 5.79744 6L2.20256 6C1.29687 6 0.844028 6 0.598457 5.84385C0.27103 5.63564 0.0936002 5.25682 0.143268 4.872C0.180518 4.58338 0.470422 4.23549 1.05023 3.53972L2.84767 1.3828Z"
                      ></path>
                    </svg>
                  </button>
                  <div class="textarea-scroll-track">
                    <div class="textarea-scroll-thumb"></div>
                  </div>
                  <button
                    class="textarea-scroll-btn textarea-scroll-down disabled"
                    type="button"
                    disabled=""
                  >
                    <svg
                      width="8"
                      height="6"
                      viewBox="0 0 8 6"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M2.84767 4.6172C3.19874 5.03849 3.37427 5.24913 3.57584 5.34354C3.8446 5.46942 4.15539 5.46942 4.42415 5.34354C4.62572 5.24913 4.80126 5.03849 5.15233 4.6172L6.94977 2.46027C7.52958 1.76451 7.81948 1.41662 7.85673 1.128C7.9064 0.743177 7.72897 0.364358 7.40154 0.156153C7.15597 3.32783e-07 6.70313 2.65766e-07 5.79744 1.31732e-07L2.20256 -4.00277e-07C1.29687 -5.34311e-07 0.844028 -6.01328e-07 0.598457 0.156152C0.27103 0.364356 0.0936002 0.743176 0.143268 1.128C0.180518 1.41662 0.470422 1.76451 1.05023 2.46028L2.84767 4.6172Z"
                      ></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            <button
              type="submit"
              class="btn btn-reset btn--accent form__btn"
              aria-label="Отправить форму обратной связи"
              disabled=""
            >
              отправить
            </button>
          </form>
        </div>
        <div class="cta__img">
          <img src="./img/hero-bg.webp" alt="" />
        </div>
        <div class="cta__row flex al-c jc-sb corner-smooth-40">
          <p class="desc1 cta__capture">Не любите заполнять формы?</p>
          <p class="desc1 cta__capture">
            Пишите на
            <a href="mailto:hello@peremena.ru" class="link-btn"
              >hello@peremena.ru</a
            >
          </p>
        </div>
      </div>
    </div>
  </section>
</div>
